version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build git-helper for every supported OS and architecture into dist/ (uses GoReleaser)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  build:test:
    desc: Build test-git-helper for this machine and install it for local testing (uses GoReleaser)
    cmds:
      - goreleaser build --snapshot --clean --single-target
      - cp ./dist/*_{{OS}}_{{ARCH}}*/git-helper{{exeExt}} test-git-helper{{exeExt}}
      - cmd: sudo mv test-git-helper /usr/local/bin/test-git-helper
        platforms: [darwin, linux]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist

  format:
    desc: Run gofmt on all Go source files
    cmds:
      - gofmt -w -l .

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
