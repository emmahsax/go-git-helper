version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build git-helper for every supported OS and architecture into dist/
    cmds:
      - task: build:target
        vars: { GOOS: darwin, GOARCH: arm64 }
      - task: build:target
        vars: { GOOS: darwin, GOARCH: amd64 }
      - task: build:target
        vars: { GOOS: linux, GOARCH: amd64 }
      - task: build:target
        vars: { GOOS: linux, GOARCH: arm64 }
      - task: build:target
        vars: { GOOS: windows, GOARCH: amd64 }
      - task: build:target
        vars: { GOOS: windows, GOARCH: arm64 }

  build:target:
    internal: true
    env:
      CGO_ENABLED: "0"
      GOARCH: "{{.GOARCH}}"
      GOOS: "{{.GOOS}}"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o dist/git-helper_{{.GOOS}}_{{.GOARCH}}{{if eq .GOOS "windows"}}.exe{{end}} .

  build:test:
    desc: Build test-git-helper for this machine and install it for testing purposes
    cmds:
      - cmd: go build -o test-git-helper{{exeExt}} .
      - cmd: sudo mv test-git-helper /usr/local/bin/test-git-helper
        platforms: [darwin, linux]
