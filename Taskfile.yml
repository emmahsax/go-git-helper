version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build git-helper for every supported OS and architecture into dist/ (uses GoReleaser)
    cmds:
      - goreleaser build --snapshot --clean

  build:release:
    desc: Dry run of a release, without publishing, to see exactly what would be uploaded to dist/ (uses GoReleaser)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  build:test:
    desc: Build test-git-helper for this machine and install it for testing purposes (uses GoReleaser)
    cmds:
      - goreleaser build --snapshot --clean --single-target --id release --output test-git-helper{{exeExt}}
      - cmd: sudo mv test-git-helper /usr/local/bin/test-git-helper
        platforms: [darwin, linux]
