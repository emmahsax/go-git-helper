name: Test

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:

jobs:
  setup:
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      branch: ${{ steps.set_branch_variable.outputs.branch }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - id: set_branch_variable
        name: Set Branch Variable
        uses: emmahsax/github-actions/set-branch-variable@main

  # Native build and tests on every runner except ubuntu-latest, which is covered below. Both build
  # and test use CGO_ENABLED=0 and -trimpath, the same settings .goreleaser.yaml releases with
  go-test:
    needs: [ setup ]
    permissions:
      contents: read
    uses: emmahsax/github-actions/.github/workflows/go-test.yml@main
    with:
      branch: ${{ needs.setup.outputs.branch }}
      build_command: CGO_ENABLED=0 go build -trimpath -v ./...
      go_version: 1.27
      install_goreleaser: false
      install_task: false
      runners: '["macos-15-intel", "macos-latest", "ubuntu-24.04-arm", "windows-11-arm", "windows-latest"]'
      staticcheck_version: master
      test_command: CGO_ENABLED=0 go test -trimpath -v ./...

  # Runs the release pipeline without publishing (every target, archives and checksums with the
  # same .goreleaser.yaml that releases use), so a broken config fails the PR, then the tests
  go-test-ubuntu:
    needs: [ setup ]
    permissions:
      contents: read
    uses: emmahsax/github-actions/.github/workflows/go-test.yml@main
    with:
      branch: ${{ needs.setup.outputs.branch }}
      build_command: task build
      go_version: 1.27
      runners: '["ubuntu-latest"]'
      staticcheck_version: master
      test_command: CGO_ENABLED=0 go test -trimpath -v ./...
