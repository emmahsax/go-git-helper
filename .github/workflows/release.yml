name: Release
run-name: Release ${{ inputs.tag_name }}

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: The tag name to make a GitHub Release for
        required: true
        type: string

jobs:
  go-release:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: emmahsax/github-actions/.github/workflows/go-release.yml@go-release-goreleaser-and-test-matrix
    with:
      go_version: 1.27
      tag_name: ${{ inputs.tag_name }}
      use_goreleaser: true
