name: Version Bump Check

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  version-bump-check:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    uses: emmahsax/github-actions/.github/workflows/version-bump-check.yml@main
    with:
      description: version update
      file: main.go
      regex: \s+packageVersion\s+=\s+"\S+"
