version: 2
project_name: git-helper

# Publish the bare binaries, named git-helper_<os>_<arch> (plus .exe on Windows),
# which is the asset name `git-helper update` looks for.
archives:
  - formats:
      - binary
    ids:
      # # Uncomment to publish the other platforms (macOS Intel, Linux, Windows) in releases.
      # # They are built on every run to prove they compile, but not uploaded yet.
      # - matrix
      - release
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

builds:
  # The platform that is published in releases
  - binary: git-helper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - arm64
    goos:
      - darwin
    id: release
    ldflags:
      - -s -w -X main.packageVersion={{ .Version }}
    main: .

  # Every other supported platform. These are built on every run to prove that
  # they compile, but are not archived or uploaded (see `archives.ids` above).
  - binary: git-helper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
      - windows
    id: matrix
    ignore:
      - goarch: arm64
        goos: darwin
    ldflags:
      - -s -w -X main.packageVersion={{ .Version }}
    main: .

changelog:
  use: github-native

checksum:
  name_template: checksums.txt
